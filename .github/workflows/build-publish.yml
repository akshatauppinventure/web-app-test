# Build, scan, push, attest and sign container images (PLAN T12; ADR-0017 §4, ADR-0019 §3-§4, ADR-0020).
# pull_request: build + Trivy gate for changed components (no push).
# push to main:  build -> Trivy gate -> push ghcr.io/<owner>/<component>:sha-<sha> with SBOM + provenance -> cosign keyless sign.
# workflow_dispatch: rebuild everything (first publish, base-image refresh).
name: build-publish

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "infra/keycloak/**"
      - "infra/traefik/**"
      - "infra/crowdsec/**"
      - "infra/postgres/**"
      - ".github/workflows/build-publish.yml"
      - "scripts/ci/changed-components.sh"
      - ".trivyignore"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Rebuild all components"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  OWNER: akshatauppinventure

jobs:
  changes:
    name: changed components
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.detect.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          FORCE_ALL: ${{ github.event.inputs.all }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" || "$FORCE_ALL" == "true" || -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            components="$(scripts/ci/changed-components.sh --all)"
          else
            components="$(scripts/ci/changed-components.sh "$BASE" "$HEAD")"
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "components: $components"

  image:
    name: ${{ matrix.component }}
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push (main only)
      id-token: write   # cosign keyless signing (main only)
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build context
        id: ctx
        run: |
          case "$COMPONENT" in
            frontend|backend) ctx="$COMPONENT" ;;
            keycloak|traefik|crowdsec|postgres) ctx="infra/$COMPONENT" ;;
            *) echo "unknown component $COMPONENT" >&2; exit 1 ;;
          esac
          echo "context=$ctx" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${OWNER}/${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build (local, for the scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.ctx.outputs.image }}:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.ctx.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Trivy gate (CRITICAL/HIGH with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ctx.outputs.image }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ctx.outputs.image }}
          tags: |
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Push with SBOM and provenance
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.ctx.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.component }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (keyless, GitHub OIDC) and verify
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.ctx.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/build-publish.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null
          echo "signed and verified ${IMAGE}@${DIGEST}"
          {
            echo "### ${COMPONENT}"
            echo '```'
            echo "${IMAGE}:sha-${GITHUB_SHA}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert SBOM and provenance attestations are attached
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.ctx.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # single-platform images expose .Provenance/.SBOM directly; multi-platform ones key them by platform
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}' \
            | jq -e '(.SLSA.buildDefinition.buildType // .SLSA.buildType // .["linux/amd64"].SLSA.buildDefinition.buildType) != null' >/dev/null
          pkgs="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}' | jq '(.SPDX.packages // .["linux/amd64"].SPDX.packages) | length')"
          [[ "$pkgs" -gt 0 ]] || { echo "SBOM has no packages"; exit 1; }
          echo "provenance (SLSA) present; SBOM lists ${pkgs} packages"

      - name: Record digest for the deploy PR
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${COMPONENT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.component }}
          path: digests/${{ matrix.component }}
          retention-days: 7

      - name: Package must not be publicly readable (ADR-0017 §5, P3)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_PATH: ${{ env.OWNER }}/${{ matrix.component }}
        run: |
          tok="$(curl -sf "https://ghcr.io/token?scope=repository:${IMAGE_PATH}:pull" | jq -r .token)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" "https://ghcr.io/v2/${IMAGE_PATH}/tags/list")"
          if [[ "$code" == "200" ]]; then
            echo "::error::ghcr.io/${IMAGE_PATH} is PUBLIC (anonymous tags/list -> 200). Make it private: Packages -> package settings -> Change visibility (docs/runbooks/owner-prerequisites.md P3)."
            exit 1
          fi
          echo "ghcr.io/${IMAGE_PATH} refuses anonymous access (HTTP ${code})"

  deploy-pr:
    name: deploy PR
    needs: [changes, image]
    if: github.event_name != 'pull_request' && needs.image.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      # An installation token (not GITHUB_TOKEN) so the PR triggers verify-deploy and ci (ADR-0018 §3).
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open one deploy PR per component
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          COMPONENTS: ${{ needs.changes.outputs.components }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          gh label create deploy --repo "$REPO" --color 0e8a16 --description "Digest bump opened by the deploy app (ADR-0018)" --force >/dev/null
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          short="${SHA:0:7}"
          for component in $(jq -r '.[]' <<<"$COMPONENTS"); do
            digest="$(tr -d '\n' < "digests/${component}")"
            branch="deploy/${component}-${short}"
            git checkout -q -B "$branch" "origin/main"
            out="$(python3 scripts/ci/bump-digest.py --component "$component" --tag "sha-${SHA}" --digest "$digest")"
            if [[ "$out" == "changed=" ]]; then echo "${component}: stacks already reference ${digest}; nothing to deploy"; continue; fi
            git add infra/stacks
            git commit -q -m "deploy(${component}): sha-${SHA}" -m "ghcr.io/${REPO%%/*}/${component}:sha-${SHA}@${digest}" -m "Built and signed by ${RUN_URL}"
            git push -q --force-with-lease origin "$branch"
            if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qx 0; then
              gh pr create --head "$branch" --base main --title "deploy(${component}): sha-${short}" --label deploy --body "$(printf 'Image built, scanned, attested and signed by %s.\n\n```\nghcr.io/%s/%s:sha-%s@%s\n```\n\n`verify-deploy` runs `cosign verify` on every digest in the stacks, then merges this PR (POC auto-merge, ADR-0018 §3). Rollback: revert this commit (docs/runbooks/deploy-and-rollback.md).' "$RUN_URL" "${REPO%%/*}" "$component" "$SHA" "$digest")"
            fi
            echo "${component}: PR for ${branch}"
          done
