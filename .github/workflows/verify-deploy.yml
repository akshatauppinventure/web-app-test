# Verify deploy PRs (PLAN T13; ADR-0018 §3, ADR-0019 §4): every ghcr.io digest referenced by the
# stacks must be signed by build-publish.yml on main; compose, port-allowlist and hardening checks
# run again; deploy PRs opened by the deploy app are merged when everything passes (POC auto-merge).
name: verify-deploy

on:
  pull_request:
    paths:
      - "infra/stacks/**"
      - "infra/host/bootstrap/**"
      - "infra/policy/**"
      - "scripts/ci/check-*"
      - ".github/workflows/verify-deploy.yml"

permissions:
  contents: read

concurrency:
  group: verify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify referenced digests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose files validate
        run: scripts/ci/check-compose.sh
      - name: Published ports allowlist
        run: scripts/ci/check-published-ports.sh
      - name: Container hardening baseline
        run: python3 scripts/ci/check-hardening.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign verify every ghcr.io digest in the stacks
        env:
          REPO: ${{ github.repository }}
        run: scripts/ci/verify-stack-digests.sh

  merge-deploy-pr:
    name: merge deploy PR
    needs: verify
    if: github.event.pull_request.user.type == 'Bot' && startsWith(github.head_ref, 'deploy/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Squash-merge (stands in for ruleset auto-merge until P12)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
