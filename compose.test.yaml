# Throwaway PostgreSQL 18 for backend integration/RLS tests (T02) and Keycloak smoke tests (T05).
# Usage: docker compose -f compose.test.yaml up -d --wait                       # postgres only
#        docker compose -f compose.test.yaml --profile keycloak up -d --wait    # + keycloak on 127.0.0.1:18080
#        docker compose -f compose.test.yaml --profile keycloak down -v
name: web-app-test-test

services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_MIGRATOR_PASSWORD_FILE: /run/secrets/app_migrator_password
      APP_RW_PASSWORD_FILE: /run/secrets/app_rw_password
      KEYCLOAK_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - postgres_password
      - app_migrator_password
      - app_rw_password
      - keycloak_db_password
    volumes:
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pgdata-test:/var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    pids_limit: 256

  keycloak:
    profiles: ["keycloak"]
    build:
      context: ./infra/keycloak
    image: web-app-test/keycloak:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_HOSTNAME: http://localhost:18080/auth
      KC_HOSTNAME_STRICT: "false"
      GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
      WEB_BFF_CLIENT_SECRET_FILE: /run/secrets/web_bff_client_secret
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
      - web_bff_client_secret
      - app_google_client_secret
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - db
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port (9000).
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /auth/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3 && grep -q ''"status": "UP"'' <&3'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /opt/keycloak/data/tmp:rw,size=64m
      - /opt/keycloak/data/transaction-logs:rw,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 512

secrets:
  postgres_password:
    file: ./scripts/test/pg-secrets/postgres_password
  app_migrator_password:
    file: ./scripts/test/pg-secrets/app_migrator_password
  app_rw_password:
    file: ./scripts/test/pg-secrets/app_rw_password
  keycloak_db_password:
    file: ./scripts/test/pg-secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./scripts/test/pg-secrets/keycloak_admin_password
  web_bff_client_secret:
    file: ./scripts/test/pg-secrets/web_bff_client_secret
  app_google_client_secret:
    file: ./scripts/test/pg-secrets/app_google_client_secret

volumes:
  pgdata-test:

networks:
  db:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
