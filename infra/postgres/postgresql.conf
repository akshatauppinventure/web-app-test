# PostgreSQL 18 configuration for the POC (ADR-0009 §4). Loaded with -c config_file=...
# Data directory and hba/ident paths:
hba_file = '/etc/postgresql/pg_hba.conf'
listen_addresses = '*'
port = 5432
max_connections = 60

# Authentication
password_encryption = scram-sha-256

# Memory (VPS-B has 2-4 GB shared with Keycloak and FastAPI)
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Write-ahead log / checkpoints
wal_level = replica
max_wal_size = 512MB
checkpoint_completion_target = 0.9

# Logging: to stderr, collected by Docker (json-file with rotation, T17)
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %u@%d %r %a '
log_connections = 'receipt,authentication,authorization'
log_disconnections = on
log_min_duration_statement = 1000
log_lock_waits = on
log_statement = 'ddl'
log_timezone = 'UTC'

# Safety
timezone = 'UTC'
idle_in_transaction_session_timeout = 60000
statement_timeout = 0
lock_timeout = 10000
