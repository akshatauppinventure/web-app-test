# Client authentication for the POC (ADR-0009 §4).
# Only scram-sha-256 over the internal `db` network subnet; local socket uses peer (the
# entrypoint runs as the `postgres` OS user during init). Everything else is rejected.
# TYPE   DATABASE   USER        ADDRESS          METHOD
local    all        postgres                     peer
local    all        all                          reject
host     all        all         172.28.1.0/24    scram-sha-256
host     all        all         0.0.0.0/0        reject
host     all        all         ::/0             reject
