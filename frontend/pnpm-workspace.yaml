# pnpm 12 settings. Supply-chain controls per ADR-0019:
# - lifecycle scripts run only for packages allowed in `allowBuilds` (true); `false` records a
#   deliberate refusal (unrs-resolver ships prebuilt optional binaries; its postinstall is a fallback)
# - packages must be at least 3 days old (4320 min) before they are installed
packages:
  - "."
allowBuilds:
  sharp: true
  unrs-resolver: false
minimumReleaseAge: 4320
strictDepBuilds: true
