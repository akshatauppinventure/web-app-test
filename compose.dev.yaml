# Local full stack (PLAN T09; ADR-0005/0009/0010/0011): Postgres, Keycloak, migrate, backend, frontend.
# Secrets come from .dev-secrets/ (scripts/dev/gen-dev-secrets.sh); GOOGLE_CLIENT_ID from .env.
# Usage: make dev-up | make dev-smoke | make dev-logs | make dev-down | make dev-reset
name: web-app-test-dev

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  postgres:
    build:
      context: ./infra/postgres
    image: web-app-test/postgres:dev
    user: "999:999"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_MIGRATOR_PASSWORD_FILE: /run/secrets/app_migrator_password
      APP_RW_PASSWORD_FILE: /run/secrets/app_rw_password
      KEYCLOAK_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [postgres_password, app_migrator_password, app_rw_password, keycloak_db_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,size=8m,uid=999,gid=999
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256

  keycloak:
    <<: *hardening
    build:
      context: ./infra/keycloak
    image: web-app-test/keycloak:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_HOSTNAME: http://localhost:8080/auth
      KC_HOSTNAME_STRICT: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset-google-client-id.apps.googleusercontent.com}
      WEB_BFF_CLIENT_SECRET_FILE: /run/secrets/web_bff_client_secret
    secrets: [keycloak_db_password, keycloak_admin_password, web_bff_client_secret, app_google_client_secret]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [db, core]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /opt/keycloak/data/tmp:rw,size=64m
      - /opt/keycloak/data/transaction-logs:rw,size=16m
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /auth/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3 && grep -q ''"status": "UP"'' <&3'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 1g
    pids_limit: 512

  migrate:
    build:
      context: ./backend
    image: web-app-test/backend:dev
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/migrate_database_url
    secrets: [migrate_database_url]
    networks: [db]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: 256m
    pids_limit: 64

  backend:
    <<: *hardening
    build:
      context: ./backend
    image: web-app-test/backend:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      OIDC_ISSUER: http://localhost:8080/auth/realms/app
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/app/protocol/openid-connect/certs
    secrets: [database_url]
    ports:
      - "127.0.0.1:8000:8000"
    networks: [db, core]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 512m
    pids_limit: 128

  frontend:
    <<: *hardening
    build:
      context: ./frontend
    image: web-app-test/frontend:dev
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      AUTH_URL: http://localhost:3000
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      AUTH_KEYCLOAK_ID: web-bff
      AUTH_KEYCLOAK_SECRET_FILE: /run/secrets/web_bff_client_secret
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/auth/realms/app
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/app
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APPLE_LOGIN: "false"
    secrets: [auth_secret, web_bff_client_secret]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [core]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /app/.next/cache:rw,nosuid,size=64m,uid=1000,gid=1000
    mem_limit: 512m
    pids_limit: 128

secrets:
  postgres_password: { file: ./.dev-secrets/postgres_password }
  app_migrator_password: { file: ./.dev-secrets/app_migrator_password }
  app_rw_password: { file: ./.dev-secrets/app_rw_password }
  keycloak_db_password: { file: ./.dev-secrets/keycloak_db_password }
  keycloak_admin_password: { file: ./.dev-secrets/keycloak_admin_password }
  web_bff_client_secret: { file: ./.dev-secrets/web_bff_client_secret }
  app_google_client_secret: { file: ./.dev-secrets/app_google_client_secret }
  auth_secret: { file: ./.dev-secrets/auth_secret }
  database_url: { file: ./.dev-secrets/database_url }
  migrate_database_url: { file: ./.dev-secrets/migrate_database_url }

volumes:
  pgdata:

networks:
  db:
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24
  core:
    ipam:
      config:
        - subnet: 172.28.2.0/24
