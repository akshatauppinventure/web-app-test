# SOPS creation rules (ADR-0016). Encrypt only to the admins' age public keys; servers hold no keys.
# Owner prerequisite P5 (done 2026-09-16): the owner's admin age recipient. The private key lives only in the owner's password manager.
# Add a second admin by appending another recipient (comma-separated) and re-running `sops updatekeys`.
creation_rules:
  - path_regex: ^infra/secrets/edge\.sops\.yaml$
    age: "age1c87ztw79n3sk6s0a7j42z8cahe7wqvgaytme3kg6t7827meezsyqv8skmd"
  - path_regex: ^infra/secrets/core\.sops\.yaml$
    age: "age1c87ztw79n3sk6s0a7j42z8cahe7wqvgaytme3kg6t7827meezsyqv8skmd"
  - path_regex: ^infra/tofu/(upcloud|ovh)/(terraform\.tfvars|.*\.tfstate(\.backup)?)\.sops$
    age: "age1c87ztw79n3sk6s0a7j42z8cahe7wqvgaytme3kg6t7827meezsyqv8skmd"
